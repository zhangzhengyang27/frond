<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>正则测试</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondRegexLib
      var lastResults = []
      var pattern = '\\d+'
      var flags = 'g'
      var currentText = ''
      var flagsOrder = ['g', 'gi', 'gm', 'gim', 'gmu', 'gs', 'gms']

      api.onEnter(function (data) {
        var args = (data && data.args) || {}
        pattern = args.pattern || pattern
        flags = args.flags || flags
        api.setSubInput('测试文本（' + pattern + ' /' + flags + '）…')
        if (args.text) {
          currentText = args.text
          process(currentText)
          return
        }
        api
          .readText()
          .then(function (res) {
            var text = (res || '').trim()
            text ? process(text) : showEmpty()
          })
          .catch(function () { showEmpty() })
      })

      api.onSubInputChange(function (data) {
        var text = data && typeof data.text === 'string' ? data.text.trim() : ''
        text ? process(text) : showEmpty()
      })

      function showEmpty() {
        api.renderList(
          [
            {
              title: '示例：在文本里找所有数字',
              subtitle: '正则 /' + pattern + '/' + flags + ' — 在副输入框粘贴测试文本',
              icon: 'regex-line',
              detail:
                '**正则测试**\n\n- 匹配列表 + 捕获组展开，detail 高亮命中\n- 动作可循环切换 flags（g → gi → gm…）\n- 「常用」组一键填入常用正则\n\n回车复制匹配内容。',
              detailFormat: 'markdown',
              actions: [
                { label: '填入示例文本', type: 'callback', payload: 'demo:订单 12-34 与 56-78', hint: '↵' },
                { label: '常用：邮箱', type: 'callback', payload: 'common:0' },
                { label: '常用：URL', type: 'callback', payload: 'common:1' },
                { label: '常用：手机号', type: 'callback', payload: 'common:2' }
              ]
            }
          ],
          { id: 'root' }
        )
      }

      function process(text) {
        currentText = text
        var results = Lib.convert(text, pattern, flags)
        if (!results) return showError(text, '正则解析失败')
        lastResults = results.map(function (r) { return r.output })
        api.renderList(
          results.map(function (r, i) {
            return {
              title: r.title, subtitle: r.subtitle || undefined,
              icon: r.icon || 'regex-line',
              section: r.section,
              accessories: r.accessories,
              detail: r.detail || undefined, detailFormat: r.detail ? 'markdown' : undefined,
              actions: [
                { label: '复制匹配', type: 'callback', payload: 'copy:' + i, hint: '↵' },
                { label: '切 flags（' + flags + '）', type: 'callback', payload: 'flag' }
              ]
            }
          }),
          { id: 'root' }
        )
      }

      function showError(text, why) {
        lastResults = [text]
        api.renderList(
          [
            {
              title: '无法测试',
              subtitle: why,
              icon: 'error-warning-line',
              actions: [{ label: '切 flags（' + flags + '）', type: 'callback', payload: 'flag' }]
            }
          ],
          { id: 'root' }
        )
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p === 'flag') {
          var cur = flagsOrder.indexOf(flags)
          flags = flagsOrder[(cur + 1) % flagsOrder.length]
          api.showHud('flags → /' + flags + '/')
          currentText ? process(currentText) : showEmpty()
        } else if (p.indexOf('demo:') === 0) {
          process(p.slice(5))
        } else if (p.indexOf('common:') === 0) {
          var ci = Number(p.slice(7))
          if (Lib.COMMON[ci]) {
            pattern = Lib.COMMON[ci].pattern
            api.showHud('正则 → ' + pattern)
            currentText ? process(currentText) : showEmpty()
          }
        }
      })
    </script>
  </body>
</html>
