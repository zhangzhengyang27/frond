<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>颜色选择器</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondColorpickerLib
      var lastResults = []
      var lastInput = ''
      var currentCmd = 'convert'

      api.onEnter(function () {
        api.setSubInput('输入颜色（#336699 / rgb(51,102,153)）…')
        api
          .readText()
          .then(function (res) {
            var text = (res || '').trim()
            text ? process(text) : showEmpty()
          })
          .catch(function () { showEmpty() })
      })

      api.onSubInputChange(function (data) {
        var text = data && typeof data.text === 'string' ? data.text.trim() : ''
        text ? process(text) : showEmpty()
      })

      function showEmpty() {
        api.renderList(
          [
            {
              title: '示例：#336699',
              subtitle: 'HEX/RGB/HSL/HSV/CMYK 五格式并列，条目自带颜色块',
              icon: 'palette-line',
              detail:
                '**颜色选择器**\n\n- 五种格式并列展示，每条左侧显示该颜色色块\n- 「最近」记录常用颜色\n- 调色板浏览（push 进入，ESC 返回）\n\n回车复制对应格式。',
              detailFormat: 'markdown',
              actions: [{ label: '填入示例', type: 'callback', payload: 'demo:#336699', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      function pushRecent(hex) {
        // 键入过程中的中间色（#336）不入「最近」，只收完整 hex（4/7 字符）
        if (hex !== '#369' && hex.length !== 4 && hex.length !== 7) return Promise.resolve()
        return api.db.get('recent').then(function (res) {
          var d = res && res.data
          var list = d && Array.isArray(d.list) ? d.list : []
          list = list.filter(function (x) { return x !== hex })
          list.unshift(hex)
          return api.db.put('recent', { list: list.slice(0, 12) })
        }).catch(function () {})
      }

      function loadRecent() {
        return api.db.get('recent').then(function (res) {
          var d = res && res.data
          return d && Array.isArray(d.list) ? d.list : []
        }).catch(function () { return [] })
      }

      function render(results, recent) {
        lastResults = results.map(function (r) { return r.output })
        var items = results.map(function (r, i) {
          return {
            title: r.title, subtitle: r.subtitle || undefined,
            icon: r.icon || 'palette-line',
            section: r.section,
            accessories: r.accessories,
            actions: [{ label: '复制', type: 'callback', payload: 'copy:' + i, hint: '↵' }]
          }
        })
        recent.forEach(function (hex, ri) {
          items.push({
            title: hex,
            subtitle: '最近使用',
            icon: { value: 'history-line', tintColor: hex },
            section: '最近',
            actions: [
              { label: '复制 HEX', type: 'callback', payload: 'copy:' + (results.length + ri), hint: '↵' },
              { label: '以该颜色重算', type: 'callback', payload: 'recalc:' + hex }
            ]
          })
          lastResults.push(hex)
        })
        items.push({
          title: '浏览调色板',
          subtitle: '15 色 HIG 调色板（push 进入，ESC 返回）',
          icon: 'paint-brush-line',
          actions: [{ label: '打开', type: 'callback', payload: 'palette', hint: '↵' }]
        })
        api.renderList(items, { id: 'root' })
      }

      function process(text) {
        lastInput = text
        var results = Lib.convert(text)
        if (!results) return showError(text)
        pushRecent(results[0].output)
        loadRecent().then(function (recent) {
          render(results, recent)
        })
      }

      function renderPalette() {
        api.renderList(
          Lib.PALETTES.map(function (p) {
            return {
              title: p.name,
              subtitle: p.hex,
              icon: { value: 'palette-line', tintColor: p.hex },
              actions: [{ label: '复制 HEX', type: 'callback', payload: 'copyhex:' + p.hex, hint: '↵' }]
            }
          }),
          { push: true, id: 'palette' }
        )
      }

      function showError(text) {
        lastResults = [text]
        api.renderList(
          [
            {
              title: '无法解析',
              subtitle: '支持 #336699 / #369 / rgb(51,102,153)',
              icon: 'error-warning-line',
              actions: [{ label: '复制原文', type: 'callback', payload: 'copy:0', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p.indexOf('copyhex:') === 0) {
          api.copyText(p.slice(8)).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p === 'palette') {
          renderPalette()
        } else if (p.indexOf('recalc:') === 0) {
          process(p.slice(7))
        } else if (p.indexOf('demo:') === 0) {
          process(p.slice(5))
        }
      })
    </script>
  </body>
</html>
