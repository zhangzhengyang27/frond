<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Lorem Ipsum 生成器</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondLoremLib
      var lastResults = []

      api.onEnter(function () {
        api.setSubInput('输入数量（默认 3）…')
        api.renderList(buildItems('paragraphs', 'latin'), { id: 'root' })
      })

      api.onSubInputChange(function (data) {
        api.renderList(buildItems('paragraphs', 'latin', parseInt((data && data.text) || '', 10)), { id: 'root' })
      })

      function buildItems(kind, lang, countOverride) {
        var defaults = { words: 20, sentences: 5, paragraphs: 3 }
        var n = countOverride > 0 ? Math.min(countOverride, defaults[kind] * 5) : defaults[kind]
        var text = Lib.generate(kind, n, lang)
        var idx = 0
        lastResults = [text]
        return [
          {
            title: (lang === 'zh' ? '中文占位文' : 'Lorem Ipsum') + ' · ' + (kind === 'words' ? '单词' : kind === 'sentences' ? '句子' : '段落') + ' × ' + n,
            subtitle: text.replace(/\n/g, ' ').slice(0, 80) + '…',
            icon: 'text',
            detail: '```\n' + (text.length > 2000 ? text.slice(0, 2000) + '\n…（共 ' + text.length + ' 字符，复制取全文）' : text) + '\n```',
            detailFormat: 'markdown',
            actions: [
              { label: '复制全文', type: 'callback', payload: 'copy:0', hint: '↵' },
              { label: '重新生成', type: 'callback', payload: 'regen:' + kind + ':' + lang + ':' + n },
              { label: '中文占位文', type: 'callback', payload: 'regen:paragraphs:zh:' + n },
              { label: '单词模式', type: 'callback', payload: 'regen:words:latin:' + (n * 30) }
            ]
          },
          {
            title: '换一种：句子 / 段落 / 中文',
            subtitle: '点击追加对应变体',
            icon: 'shuffle-line',
            actions: [
              { label: '句子模式', type: 'callback', payload: 'regen:sentences:latin:' + n },
              { label: '中文占位文', type: 'callback', payload: 'regen:paragraphs:zh:' + n }
            ]
          }
        ]
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p.indexOf('regen:') === 0) {
          var parts = p.slice(6).split(':')
          api.renderList(buildItems(parts[0], parts[1], parseInt(parts[2], 10)), { id: 'root' })
        }
      })
    </script>
  </body>
</html>
