<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>二维码生成器</title>
  </head>
  <body>
    <canvas id="qrCanvas" style="display: none"></canvas>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondQrcodeLib
      var canvas = document.getElementById('qrCanvas')
      var lastResults = []
      var lastInput = ''

      api.onEnter(function () {
        api.setSubInput('输入文本/URL 生成二维码…')
        api
          .readText()
          .then(function (res) {
            var text = (res || '').trim()
            text ? process(text) : showEmpty()
          })
          .catch(function () { showEmpty() })
      })

      api.onSubInputChange(function (data) {
        var text = data && typeof data.text === 'string' ? data.text.trim() : ''
        text ? process(text) : showEmpty()
      })

      function showEmpty() {
        api.renderList(
          [
            {
              title: '示例：https://frond.app',
              subtitle: '本地生成二维码，支持纠错级别与尺寸偏好',
              icon: 'qr-code-line',
              detail:
                '**二维码生成器**\n\n- 输入文本/URL 即时生成，全程本地计算\n- 纠错级别（L/M/Q/H）与尺寸在设置页修改后即时生效\n- 条目直接显示二维码缩略图，回车复制 PNG 图片\n\n回车复制图片。',
              detailFormat: 'markdown',
              actions: [{ label: '填入示例', type: 'callback', payload: 'demo:https://frond.app', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      /** 矩阵 → canvas → PNG dataUrl（浏览器 API，留在视图层） */
      function renderToDataUrl(matrix, size) {
        var count = matrix.size
        var margin = 4
        var tileSize = Math.max(1, Math.floor(size / (count + margin * 2)))
        var actualSize = tileSize * (count + margin * 2)
        canvas.width = actualSize
        canvas.height = actualSize
        var ctx = canvas.getContext('2d')
        ctx.fillStyle = '#ffffff'
        ctx.fillRect(0, 0, actualSize, actualSize)
        ctx.fillStyle = '#000000'
        for (var row = 0; row < count; row++) {
          for (var col = 0; col < count; col++) {
            if (matrix.modules[row][col]) {
              ctx.fillRect((col + margin) * tileSize, (row + margin) * tileSize, tileSize, tileSize)
            }
          }
        }
        return canvas.toDataURL('image/png')
      }

      function process(text) {
        lastInput = text
        api.preferences.get('size').then(function (sRes) {
          return api.preferences.get('ecc').then(function (eRes) {
            var size = parseInt((sRes && sRes.ok && sRes.value) || '256', 10) || 256
            var ecc = (eRes && eRes.ok && eRes.value) || 'M'
            var matrix = Lib.qrEncode(text, { eccLevel: ecc })
            if (!matrix) return showError(text, '内容过长或包含无法编码的字符（版本 1-40 容量上限）')
            var dataUrl = renderToDataUrl(matrix, size)
            lastResults = [dataUrl, text]
            var eccLabels = { L: '低(7%)', M: '中(15%)', Q: '较高(25%)', H: '高(30%)' }
            api.renderList(
              [
                {
                  title: '二维码已生成（' + text.length + ' 字符 · v' + matrix.version + '）',
                  subtitle: '纠错 ' + (eccLabels[ecc] || ecc) + ' · ' + size + 'px · 回车复制图片',
                  icon: { value: 'qr-code-line', dataUrl: dataUrl },
                  accessories: [{ tag: ecc, tone: 'default' }],
                  detail:
                    '**二维码内容**\n\n```\n' +
                    (text.length > 200 ? text.slice(0, 200) + '…' : text) +
                    '\n```\n\n- 纠错级别: ' +
                    (eccLabels[ecc] || ecc) +
                    '\n- 尺寸: ' +
                    size +
                    'px\n- 回车复制二维码图片（PNG dataURL）',
                  detailFormat: 'markdown',
                  actions: [
                    { label: '复制图片（PNG dataURL）', type: 'callback', payload: 'copy:0', hint: '↵' },
                    { label: '复制文本', type: 'callback', payload: 'copy:1', hint: '⌘1' }
                  ]
                }
              ],
              { id: 'root' }
            )
          })
        }).catch(function () { showError(text, '偏好读取失败') })
      }

      function showError(text, why) {
        lastResults = [text]
        api.renderList(
          [
            {
              title: '生成失败',
              subtitle: why,
              icon: 'error-warning-line',
              actions: [{ label: '复制原文', type: 'callback', payload: 'copy:0', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p.indexOf('demo:') === 0) {
          process(p.slice(5))
        }
      })
    </script>
  </body>
</html>
