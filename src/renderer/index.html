<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Frond</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data:; script-src 'self' file: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: file: image:; font-src 'self' data:; media-src 'self' file: data: blob: http: https: video:; worker-src 'self' blob:; connect-src 'self' file: data: http://localhost:3000 http://127.0.0.1:3000;"
    />
  </head>

  <body>
    <!--
      启动闪屏（SplashScreen）。
      背景色 + 静态品牌元素，避免 Vue mount 前的「白屏」。
      Vue mount 后由 src/renderer/src/main.ts 立刻移除。
    -->
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-logo">🌿</div>
        <div class="splash-name">Frond</div>
        <div class="splash-tagline">Tools that breathe with your day.</div>
        <div class="splash-spinner" role="progressbar" aria-label="loading">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
