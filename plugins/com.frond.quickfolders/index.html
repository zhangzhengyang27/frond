<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>常用目录</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondQuickfoldersLib
      var DB_KEY = 'quickfolders:list'

      // 目录统一存 `~/Documents` 紧凑形态：`~` 由宿主在 openPath 侧统一展开。
      // v2 数据结构 [{path, pinned, openCount}]（v1 纯 string 数组自动迁移）。
      function getFolders() {
        return api.db.get(DB_KEY).then(function (stored) {
          var saved = stored && stored.data
          if (Array.isArray(saved) && saved.length > 0) return Lib.migrate(saved)
          return api.preferences.get('defaultFolders').then(function (r) {
            var raw = r && r.ok && r.value ? String(r.value) : '~/Desktop,~/Documents,~/Downloads'
            var list = raw
              .split(',')
              .map(function (s) {
                return s.trim()
              })
              .filter(Boolean)
            var migrated = Lib.migrate(list)
            return api.db.put(DB_KEY, migrated).then(function () {
              return migrated
            })
          })
        })
      }

      function saveFolders(folders) {
        return api.db.put(DB_KEY, folders)
      }

      function renderFolders(query) {
        var q = (query || '').toLowerCase()
        return getFolders().then(function (folders) {
          var sorted = Lib.sortFolders(folders)
          var rows = sorted
            .filter(function (f) {
              if (!q) return true
              var name = Lib.normalizeName(f.path)
              return name.toLowerCase().indexOf(q) !== -1 || f.path.toLowerCase().indexOf(q) !== -1
            })
            .map(function (f) {
              var name = Lib.normalizeName(f.path)
              var meta = []
              if (f.pinned) meta.push('置顶')
              if (f.openCount > 0) meta.push('打开 ' + f.openCount + ' 次')
              var kids = Lib.childrenOf(folders, f.path)
              var actions = [
                { label: '打开', type: 'callback', payload: 'open:' + f.path, hint: '↵' },
                { label: '复制路径', type: 'copy', payload: f.path, hint: '⌘1' },
                { label: f.pinned ? '取消置顶' : '置顶', type: 'callback', payload: (f.pinned ? 'unpin:' : 'pin:') + f.path },
                { label: '移除', type: 'callback', payload: 'remove:' + f.path, hint: '⌘2' }
              ]
              if (kids.length > 1) {
                actions.push({ label: '浏览子目录（' + (kids.length - 1) + '）', type: 'callback', payload: 'children:' + f.path })
              }
              return {
                title: name,
                subtitle: f.path,
                icon: f.pinned ? 'pushpin-line' : 'folder-line',
                accessories: meta.length ? [{ tag: meta.join(' · ') }] : undefined,
                detail: '路径：' + f.path + (kids.length > 1 ? '\n\n包含 ' + (kids.length - 1) + ' 个已保存子目录' : ''),
                actions: actions
              }
            })
          if (rows.length === 0) {
            rows.push({
              title: '没有匹配的目录',
              subtitle: q ? '试试其他关键词，或用「添加常用目录」命令添加' : '还没有保存任何目录',
              icon: 'folder-info-line',
              actions: [{ label: '知道了', type: 'callback', payload: 'noop' }]
            })
          }
          api.renderList(rows, { id: 'root' })
        })
      }

      function renderChildren(path) {
        return getFolders().then(function (folders) {
          var kids = Lib.childrenOf(folders, path)
          api.renderList(
            kids.map(function (f) {
              var name = Lib.normalizeName(f.path)
              return {
                title: name,
                subtitle: f.path,
                icon: 'folder-line',
                actions: [
                  { label: '打开', type: 'callback', payload: 'open:' + f.path, hint: '↵' },
                  { label: '复制路径', type: 'copy', payload: f.path, hint: '⌘1' }
                ]
              }
            }),
            { push: true, id: 'children' }
          )
        })
      }

      function addFromClipboard() {
        return api.readText().then(function (text) {
          var path = (text || '').trim()
          if (!path) {
            api.renderList([
              {
                title: '剪贴板为空',
                subtitle: '请先复制一个文件夹路径，再执行本命令',
                icon: 'clipboard-line',
                actions: [{ label: '知道了', type: 'callback', payload: 'close' }]
              }
            ])
            return
          }
          return getFolders().then(function (folders) {
            var exists = folders.some(function (f) {
              return f.path === path
            })
            if (exists) {
              api.renderList([
                { title: '已存在', subtitle: path, icon: 'information-line', actions: [{ label: '关闭', type: 'callback', payload: 'close' }] }
              ])
              return
            }
            var next = Lib.migrate([{ path: path, pinned: false, openCount: 0 }]).concat(folders)
            return saveFolders(next).then(function () {
              api.renderList([
                { title: '已添加', subtitle: path, icon: 'checkbox-circle-line', actions: [{ label: '关闭', type: 'callback', payload: 'close' }] }
              ])
            })
          })
        })
      }

      api.onEnter(function (data) {
        var cmd = data && data.cmd
        if (cmd === 'add') {
          addFromClipboard()
        } else {
          renderFolders('')
        }
      })

      api.onSubInputChange(function (data) {
        renderFolders(data && data.text ? data.text : '')
      })

      api.onAction(function (payload) {
        var action = payload.action
        if (action.type !== 'callback') return
        var p = action.payload || ''
        if (p === 'close') {
          api.close()
          return
        }
        if (p === 'noop') return
        if (p.indexOf('open:') === 0) {
          var openTarget = p.slice('open:'.length)
          getFolders().then(function (folders) {
            var next = folders.map(function (f) {
              if (f.path !== openTarget) return f
              return { path: f.path, pinned: f.pinned, openCount: (f.openCount || 0) + 1 }
            })
            return saveFolders(next)
          }).then(function () {
            return api.openPath(openTarget).then(function (ok) {
              if (ok) api.showHud('已打开')
              else api.showHud('打开失败')
            })
          }).catch(function () { api.showHud('打开失败') })
          return
        }
        if (p.indexOf('remove:') === 0) {
          var target = p.slice('remove:'.length)
          getFolders().then(function (folders) {
            var next = folders.filter(function (f) {
              return f.path !== target
            })
            return saveFolders(next).then(function () {
              api.showHud('已移除')
              renderFolders('')
            })
          })
        } else if (p.indexOf('pin:') === 0 || p.indexOf('unpin:') === 0) {
          var pinTarget = p.slice(p.indexOf(':') + 1)
          var wantPin = p.indexOf('pin:') === 0
          getFolders().then(function (folders) {
            var next = folders.map(function (f) {
              if (f.path !== pinTarget) return f
              return { path: f.path, pinned: wantPin, openCount: f.openCount }
            })
            return saveFolders(next).then(function () {
              api.showHud(wantPin ? '已置顶' : '已取消置顶')
              renderFolders('')
            })
          })
        } else if (p.indexOf('children:') === 0) {
          renderChildren(p.slice('children:'.length))
        }
      })

      // open 动作成功后由宿主执行；打开计数在条目 open 前 callback 记录（用 onAction 拦不到 open）
      // 简化：置顶/浏览子目录已覆盖排序诉求，openCount 通过 add 命令外的使用逐步累积。
    </script>
  </body>
</html>
