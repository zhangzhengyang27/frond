<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Leaf Screenshot</title>
    <!--
      OCR（tesseract.js）运行时从 CDN 拉取 worker 与语言包（jsdelivr / unpkg /
      tessdata.projectnaptha.com），故 script-src / connect-src 保留这三个源；
      'wasm-unsafe-eval' 为 tesseract WASM 编译所需（比 'unsafe-eval' 窄）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob: file: https://cdn.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com;"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/screenshot-entry.ts"></script>
  </body>
</html>
