<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>UUID 生成器</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondUuidLib
      var lastResults = []
      var lastCount = 5

      api.onEnter(function () {
        api.setSubInput('输入数量（默认 5）…')
        api.renderList(buildItems(), { id: 'root' })
      })

      api.onSubInputChange(function (data) {
        var n = parseInt((data && data.text) || '', 10)
        lastCount = isNaN(n) ? 5 : Math.max(1, Math.min(100, n))
        api.renderList(buildItems(), { id: 'root' })
      })

      function buildItems() {
        var v4s = Lib.generate(lastCount, 'std')
        var v7 = Lib.uuidv7()
        lastResults = v4s.concat([v7], v4s.map(function (u) { return Lib.formatUuid(u, 'upper') }))
        var items = v4s.map(function (u, i) {
          return {
            title: u,
            subtitle: 'UUID v4（随机）',
            icon: 'fingerprint-line',
            actions: [{ label: '复制', type: 'callback', payload: 'copy:' + i, hint: '↵' }]
          }
        })
        items.push({
          title: v7,
          subtitle: 'UUID v7（时间有序，RFC 9562）',
          icon: 'time-line',
          actions: [{ label: '复制', type: 'callback', payload: 'copy:' + v4s.length, hint: '↵' }]
        })
        items.push({
          title: '切换格式：大写 / 无连字符 / URN',
          subtitle: '对上方 ' + v4s.length + ' 条 v4 追加变体条目',
          icon: 'exchange-line',
          actions: [
            { label: '大写变体', type: 'callback', payload: 'fmt:upper' },
            { label: '无连字符变体', type: 'callback', payload: 'fmt:compact' },
            { label: 'URN 变体', type: 'callback', payload: 'fmt:urn' }
          ]
        })
        return items
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p.indexOf('fmt:') === 0) {
          var fmt = p.slice(4)
          var v4s = lastResults.slice(0, lastCount)
          var variants = v4s.map(function (u) { return Lib.formatUuid(u, fmt) })
          lastResults = lastResults.concat(variants)
          api.renderList(
            variants.map(function (u, i) {
              return {
                title: u,
                subtitle: 'UUID v4 · ' + fmt,
                icon: 'fingerprint-line',
                actions: [{ label: '复制', type: 'callback', payload: 'copy:' + (lastCount + 1 + i), hint: '↵' }]
              }
            }),
            { id: 'root' }
          )
        }
      })
    </script>
  </body>
</html>
