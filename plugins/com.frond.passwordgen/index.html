<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>密码生成器</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondPasswordgenLib
      var lastResults = []
      var customLength = null

      api.onEnter(function () {
        api.setSubInput('输入自定义长度（4-128，留空用预置默认）…')
        api.preferences.get('length').then(function (v) {
          var n = parseInt(v, 10)
          customLength = isNaN(n) ? null : n
        }).catch(function () {}).then(function () { api.renderList(buildItems(), { id: 'root' }) })
      })

      api.onSubInputChange(function (data) {
        var n = parseInt((data && data.text) || '', 10)
        customLength = isNaN(n) ? null : Math.max(4, Math.min(128, n))
        api.renderList(buildItems(), { id: 'root' })
      })

      function buildItems() {
        var names = ['strong', 'medium', 'readable', 'pin']
        var items = []
        lastResults = []
        names.forEach(function (name) {
          var preset = Lib.PRESETS[name]
          var len = customLength !== null && name !== 'pin' ? customLength : preset.length
          var r = Lib.generate(name, len)
          if (!r) return
          var idx = lastResults.length
          lastResults.push(r.password)
          items.push({
            title: r.password,
            subtitle: preset.label + '方案 · ' + len + ' 位 · 全集约 ' + Math.round(r.entropyBits) + ' bit 熵',
            icon: 'shield-keyhole-line',
            accessories: [{ tag: '~' + Math.round(r.entropyBits) + 'bit', tone: r.entropyBits >= 100 ? 'success' : 'warn' }],
            detail:
              '**' + preset.label + '方案**\n\n- 长度 ' + len + '\n- 字符集约 ' + Math.round(r.entropyBits) + ' bit 熵\n- 密码仅在本地生成，不会上传',
            detailFormat: 'markdown',
            actions: [
              { label: '复制密码', type: 'callback', payload: 'copy:' + idx, hint: '↵' },
              { label: '复制并重新生成', type: 'callback', payload: 'regen' },
              { label: '批量 10 条', type: 'callback', payload: 'batch:' + name }
            ]
          })
        })
        return items
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p === 'regen') {
          api.renderList(buildItems(), { id: 'root' })
        } else if (p.indexOf('batch:') === 0) {
          var name = p.slice(6)
          var len = customLength !== null && name !== 'pin' ? customLength : Lib.PRESETS[name].length
          var list = Lib.batch(name, len, 10)
          if (!list.length) return
          var base = lastResults.length
          lastResults = lastResults.concat(list)
          api.renderList(
            list.map(function (pw, i) {
              return {
                title: pw,
                subtitle: name + ' · 批量第 ' + (i + 1) + ' 条',
                icon: 'shield-keyhole-line',
                actions: [{ label: '复制', type: 'callback', payload: 'copy:' + (base + i), hint: '↵' }]
              }
            }),
            { push: true }
          )
        }
      })
    </script>
  </body>
</html>
