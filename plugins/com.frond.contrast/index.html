<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>颜色对比度检查</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondContrastLib
      var lastResults = []
      var lastInput = ''

      api.onEnter(function () {
        api.setSubInput('输入前景/背景（如 #000/#fff）…')
        api
          .readText()
          .then(function (res) {
            var text = (res || '').trim()
            text ? process(text) : showEmpty()
          })
          .catch(function () { showEmpty() })
      })

      api.onSubInputChange(function (data) {
        var text = data && typeof data.text === 'string' ? data.text.trim() : ''
        text ? process(text) : showEmpty()
      })

      function showEmpty() {
        api.renderList(
          [
            {
              title: '示例：#000/#fff',
              subtitle: '21:1 · WCAG AA/AAA 判定，交换前后景一键对比',
              icon: 'contrast-drop-line',
              detail:
                '**颜色对比度**\n\n- 输入语法：`前景/背景` 或 `前景 背景`\n- detail 展示 WCAG 2.x 四档判定表\n- 「互换」动作一键反转前后景\n\n回车复制比率值。',
              detailFormat: 'markdown',
              actions: [
                { label: '填入示例', type: 'callback', payload: 'demo:#000/#fff', hint: '↵' },
                { label: '示例：#777/#fff', type: 'callback', payload: 'demo:#777/#fff' },
                { label: '示例：#767676/#fff', type: 'callback', payload: 'demo:#767676/#fff' }
              ]
            }
          ],
          { id: 'root' }
        )
      }

      function process(text) {
        lastInput = text
        var results = Lib.convert(text)
        if (!results) return showError(text)
        lastResults = results.map(function (r) { return r.output })
        api.renderList(
          results.map(function (r, i) {
            return {
              title: r.title, subtitle: r.subtitle || undefined,
              icon: r.icon || 'contrast-drop-line',
              section: r.section,
              accessories: r.accessories,
              detail: r.detail || undefined, detailFormat: r.detail ? 'markdown' : undefined,
              actions: [
                { label: '复制比率', type: 'callback', payload: 'copy:' + i, hint: '↵' },
                { label: '互换前景/背景', type: 'callback', payload: 'swap', hint: '⌘1' }
              ]
            }
          }),
          { id: 'root' }
        )
      }

      function showError(text) {
        lastResults = [text]
        api.renderList(
          [
            {
              title: '无法解析',
              subtitle: '需要两个颜色，语法 #000/#fff（支持 #369 缩写）',
              icon: 'error-warning-line',
              actions: [{ label: '复制原文', type: 'callback', payload: 'copy:0', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p === 'swap') {
          var parts = lastInput.split(/[/\s]+/)
          if (parts.length === 2) process(parts[1] + '/' + parts[0])
        } else if (p.indexOf('demo:') === 0) {
          process(p.slice(5))
        }
      })
    </script>
  </body>
</html>
