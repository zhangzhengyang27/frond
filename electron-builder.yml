appId: com.frond.app
productName: Frond
directories:
  buildResources: build
  # electron-vite 产物在 out/{main,preload,renderer}；打包输出统一到 out/make，
  # 与 .github/workflows/release.yml 的 artifact 路径保持一致
  output: out/make
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CONTRIBUTING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  # 开发/测试/文档资产不进安装包（默认 **/* 会把仓库根下所有目录打进 asar）
  - '!{docs,e2e,example-plugin,vibe_images,test-results,scripts,.github,.zcode,.pnpm-store}/**'
  - '!{playwright.config.mjs,vitest.config.mts,stylelint.config.mjs,tailwind.config.js,postcss.config.js}'
  # 根目录 plugins/plugins.json 已由 extraResources 复制到 resources/，避免双份打进 asar；
  # traineddata 是 OCR 模型（约 7.6MB，resources 内已有副本则同样排除）；
  # draft_* 是本地草稿内容，绝不能随安装包分发
  - '!plugins/**'
  - '!plugins.json'
  - '!*.traineddata'
  - '!draft_*'
asarUnpack:
  - resources/**
  - node_modules/@ffmpeg-installer/**
  - node_modules/uiohook-napi/**
  # better-sqlite3 是原生模块（NAPI 预编译 prebuilds/*.node），.node 不能从 asar 内加载
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
  # 截图采集侧：node-screenshots 是 NAPI-RS 的按平台预编译包（darwin-arm64 / win32-x64 / linux-*），
  # 真正的 .node 在平台包里；electron-screenshots 通过 `await import('node-screenshots')` 用它抓屏。
  # 用 **/ 前缀是因为 pnpm 下这些包挂在 .pnpm 目录里，不在顶层 node_modules。
  - '**/node_modules/node-screenshots/**'
  - '**/node_modules/node-screenshots-*/**'
extraResources:
  # 静态插件市场索引（M3.5）：打包后位于 resources/plugins.json
  - from: plugins.json
    to: plugins.json
  # 官方种子插件：打包后位于 resources/plugins/，供市场索引相对路径解析
  - from: plugins
    to: plugins
    filter:
      - '**/*.json'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.md'
      - '**/*.d.ts'
win:
  executableName: Frond
  # 未提供 .ico 时 electron-builder 会由 build/icon.png 转换（源图 1024×1024）
  icon: build/icon.png
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  # 主 app 的 hardened runtime 授权：按本应用真实用到的能力逐条给，
  # 每条的依据写在 plist 的注释里（JIT / 原生模块与 ffmpeg / 网络 / 麦克风与摄像头 / 用户选定文件）
  entitlements: build/entitlements.mac.plist
  # 子进程（Electron helper / ffmpeg）不会自动继承主进程授权，必须显式给 inherit
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSCameraUseContinuityCameraDeviceType: true
  # 公证（notarize）
  # 默认通过 electron-notarize 调用 notarytool（Xcode 14+）
  # 需要环境变量（注入自 GitHub Actions secret）：
  #   APPLE_ID                    Apple ID 邮箱
  #   APPLE_APP_SPECIFIC_PASSWORD App-specific password
  #   APPLE_TEAM_ID               10 位 Team ID
  # 本地调试可用 notarytool --store-in-keychain-profile 持久化。
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  # signing identity：
  # - CI：通过 CSC_LINK / CSC_KEY_PASSWORD 注入 .p12 证书
  # - 本地：electron-builder 默认走系统 keychain 查找
  #   "Developer ID Application: Your Name (TEAMID)"，故本地通常无需额外配置
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  icon: build/icon.png
  # deb 的 Maintainer 字段不能留 electronjs.org 这类占位（会写进包元数据）
  maintainer: Frond <frond-app@users.noreply.github.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 自动更新配置：
# - 开源项目默认使用 GitHub Releases（provider: github）
# - 发布时设置环境变量 GH_TOKEN 或在 ~/.netrc 配置 GitHub token
# - 如需自建更新服务器，改回 provider: generic + url
# - 私有仓库或需要统计时可改用 generic provider + 自建静态服务器
publish:
  provider: github
  owner: zhangzhengyang27
  repo: frond
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
