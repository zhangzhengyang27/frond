<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Cron 解析</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondCronLib
      var lastResults = []
      var lastInput = ''

      api.onEnter(function () {
        api.setSubInput('输入 Cron 表达式（如 0 9 * * 1-5）…')
        api
          .readText()
          .then(function (res) {
            var text = (res || '').trim()
            if (text && /^[\d\s*\/\-,\?LW#]+$/.test(text)) process(text)
            else showEmpty()
          })
          .catch(function () { showEmpty() })
      })

      api.onSubInputChange(function (data) {
        var text = data && typeof data.text === 'string' ? data.text.trim() : ''
        text && /^[\d\s*\/\-,\?LW#]+$/.test(text) ? process(text) : showEmpty()
      })

      function showEmpty() {
        api.renderList(
          [
            {
              title: '示例：0 9 * * 1-5',
              subtitle: '工作日每天 9 点——人类描述 + 下次 5 次执行 + 字段解释',
              icon: 'timer-flash-line',
              detail:
                '**Cron 解析**\n\n- 支持 5/6/7 段表达式\n- 人类可读描述、下次 5 次执行时间、各字段含义\n- 「常用」组一键填入常见表达式\n\n回车复制对应值。',
              detailFormat: 'markdown',
              actions: [{ label: '填入示例', type: 'callback', payload: 'demo:0 9 * * 1-5', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      function process(text) {
        lastInput = text
        var results = Lib.convert(text)
        if (!results || !results.length) return showError(text)
        lastResults = results.map(function (r) { return r.output })
        api.renderList(
          results.map(function (r, i) {
            return {
              title: r.title, subtitle: r.subtitle || undefined,
              icon: r.icon || 'checkbox-circle-line',
              section: r.section,
              accessories: r.accessories,
              actions: [{ label: '复制值', type: 'callback', payload: 'copy:' + i, hint: '↵' }]
            }
          }),
          { id: 'root' }
        )
      }

      function showError(text) {
        api.renderList(
          [
            {
              title: '无效的 Cron 表达式',
              subtitle: '应为 5/6/7 段（分 时 日 月 周）',
              icon: 'error-warning-line',
              actions: [{ label: '复制输入', type: 'callback', payload: 'copy:-1', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
        lastResults = [text]
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = idx >= 0 ? lastResults[idx] : lastInput
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p.indexOf('demo:') === 0) {
          process(p.slice(5))
        }
      })
    </script>
  </body>
</html>
