<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>JWT 解码</title>
  </head>
  <body>
    <script src="lib.js"></script>
    <script>
      var api = window.launcherApi
      var Lib = window.FrondJwtLib
      var lastResults = []
      var lastInput = ''
      var lastOutput = null

      api.onEnter(function () {
        api.setSubInput('粘贴 JWT（eyJ… 格式）…')
        api
          .readText()
          .then(function (res) {
            var text = (res || '').trim()
            text ? process(text) : showEmpty()
          })
          .catch(function () { showEmpty() })
      })

      api.onSubInputChange(function (data) {
        var text = data && typeof data.text === 'string' ? data.text.trim() : ''
        text ? process(text) : showEmpty()
      })

      function showEmpty() {
        api.renderList(
          [
            {
              title: '示例：粘贴一段 eyJ 开头的 JWT',
              subtitle: 'Header/Payload 分组展示，时间戳 claim 自动可读化',
              icon: 'key-2-line',
              detail:
                '**JWT 解码**\n\n- Header / Payload 逐条展示，exp/iat 自动转可读时间并标注有效/过期\n- ⚠ 仅解码展示，**不校验签名**——不要据此信任内容\n- 回车复制选中 claim 的值',
              detailFormat: 'markdown',
              actions: [{ label: '等待输入', type: 'callback', payload: 'noop', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      function process(text) {
        lastInput = text
        var results = Lib.convert(text)
        if (!results) return showError(text)
        lastResults = results.map(function (r) { return r.output })
        if (results[0].output !== lastOutput) {
          lastOutput = results[0].output
          pushHistory(text, results[0].output)
        }
        loadHistory().then(function (hist) {
          api.renderList(buildItems(results, hist), { id: 'root' })
        })
      }

      function loadHistory() {
        return api.db.get('history').then(function (res) {
          var d = res && res.data
          return d && Array.isArray(d.list) ? d.list : []
        }).catch(function () { return [] })
      }

      function buildItems(results, hist) {
        var items = results.map(function (r, i) {
          return {
            title: r.title, subtitle: r.subtitle || undefined,
            icon: r.icon || 'key-2-line',
            section: r.section, detail: r.detail || undefined, detailFormat: r.detail ? 'markdown' : undefined,
            accessories: r.accessories,
            actions: [{ label: '复制值', type: 'callback', payload: 'copy:' + i, hint: '↵' }]
          }
        })
        hist.forEach(function (h) {
          items.push({
            title: String(h.output).slice(0, 60),
            subtitle: '输入: ' + String(h.input).slice(0, 60),
            icon: 'history-line', section: '历史',
            actions: [{ label: '复制该结果', type: 'callback', payload: 'copyh:' + h.ts, hint: '↵' }]
          })
        })
        if (hist.length) items.push({ title: '清空历史（' + hist.length + ' 条）', icon: 'delete-bin-line', actions: [{ label: '清空', type: 'callback', payload: 'clear-history' }] })
        return items
      }

      function pushHistory(input, output) {
        return loadHistory().then(function (list) {
          list = list.filter(function (h) { return !(h.input === input && h.output === output) })
          // 前缀滚动：连续键入（本次 input 以最新一条开头）时替换最新一条，避免逐字符前缀灌满历史
          if (list.length > 0 && input !== list[0].input && input.indexOf(list[0].input) === 0) {
            list.shift()
          }
          list.unshift({ input: input, output: output, ts: Date.now() })
          return api.db.put('history', { list: list.slice(0, 20) })
        }).catch(function () {})
      }

      function showError(text) {
        lastResults = [text]
        api.renderList(
          [
            {
              title: '解码失败',
              subtitle: '不是合法的 JWT（应为三段 base64url）',
              icon: 'error-warning-line',
              actions: [{ label: '复制原文', type: 'callback', payload: 'copy:0', hint: '↵' }]
            }
          ],
          { id: 'root' }
        )
      }

      api.onAction(function (data) {
        var p = data && data.action && typeof data.action.payload === 'string' ? data.action.payload : ''
        if (p.indexOf('copy:') === 0) {
          var idx = Number(p.slice(5))
          var content = lastResults[idx]
          if (typeof content !== 'string') return
          api.copyText(content).then(function () { api.showHud('已复制') }).catch(function () {})
        } else if (p.indexOf('copyh:') === 0) {
          var ts = Number(p.slice(6))
          loadHistory().then(function (list) {
            var hit = list.filter(function (h) { return h.ts === ts })[0]
            if (hit) return api.copyText(hit.output).then(function () { api.showHud('已复制') })
          }).catch(function () {})
        } else if (p === 'clear-history') {
          api.alert({ title: '清空历史', message: '确定清空全部历史记录？',
            actions: [{ id: 'ok', title: '清空', style: 'destructive' }, { id: 'cancel', title: '取消', style: 'cancel' }]
          }).then(function (id) {
            if (id !== 'ok') return
            api.db.put('history', { list: [] }).then(function () { lastOutput = null; showEmpty() })
          })
        }
      })
    </script>
  </body>
</html>
